name: team08
networks:
  core-network:
    external: true
services:
  frontend:
    image: localhost:5000/team08/frontend:dev
    networks: [core-network]
    ports: ["8080:80"]
  api:
    image: localhost:5000/team08/api:dev
    networks: [core-network]
    ports: ["8081:8081"]
    environment:
      DB_HOST: postgres.internal
      DB_NAME: team08
      DB_USER: postgres
      DB_PASSWORD: postgres-dev-password
      VAULT_ADDR: http://openbao.internal:8200
      REDIS_URL: redis://valkey.internal:6379
      S3_ENDPOINT: http://host.containers.internal:9000
